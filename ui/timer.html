<!DOCTYPE html>
<html lang="en" data-title-key="win.timer.title">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TimeWatch</title>
  <link rel="stylesheet" href="timer.css">
</head>
<body>
  <div class="card drag" id="card">
    <div class="corner left">
      <button id="pin" class="icon-btn" type="button" aria-pressed="false" data-i18n-title="timer.pin" data-i18n-aria-label="timer.pin">📌</button>
    </div>
    <div class="corner right">
      <button id="settings" class="icon-btn" type="button" data-i18n-title="timer.settings" data-i18n-aria-label="timer.settings">⚙</button>
      <button id="hide" class="icon-btn" type="button" data-i18n-title="timer.hide" data-i18n-aria-label="timer.hideLabel">–</button>
    </div>

    <button id="record" class="record" type="button" data-status="stopped" data-i18n-title="timer.recordTitle">
      <svg class="glyph" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
        <path class="g-play" d="M8 5.5v13a1 1 0 0 0 1.52.85l10.4-6.5a1 1 0 0 0 0-1.7L9.52 4.65A1 1 0 0 0 8 5.5z"/>
        <rect class="g-stop" x="5" y="5" width="14" height="14" rx="3.2"/>
      </svg>
    </button>
    <div id="paused" class="paused" hidden></div>

    <div id="time" class="time" aria-live="off">0:00</div>
    <div id="prompt" class="prompt" data-i18n="timer.prompt" hidden></div>

    <div class="footer">
      <span id="syncDot" class="dot ok" tabindex="0" role="img" data-i18n-aria-label="timer.syncLabel"></span>
      <span id="project" class="project" title=""></span>
    </div>
  </div>
  <script src="tauri-bridge.js"></script>
  <script src="i18n-client.js"></script>
  <script src="timer.js"></script>
</body>
</html>
